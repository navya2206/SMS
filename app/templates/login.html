{% extends 'base_public.html' %}{% block content %}<div class="login-card row g-0 mx-auto"><div class="col-md-5 navy p-5 text-white"><h1>One login.<br>Your own dashboard.</h1><p class="mt-4">New first-year student? <a class="text-white" href="/register">Register here</a></p></div><div class="col-md-7 bg-white p-5"><h2>Sign in</h2>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><input class="form-control mb-3" name="username" placeholder="Email or roll number" required><input class="form-control mb-3" type="password" name="password" placeholder="Password" required><button class="btn btn-navy w-100">Login</button></form></div></div>{% endblock %}
