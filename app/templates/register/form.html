{% extends 'base_public.html' %}{% block content %}<div class="card p-4 mx-auto" style="max-width:900px"><h2>First-year registration</h2>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data"><div class="row g-3"><input class="form-control" name="full_name" placeholder="Full name" required><input class="form-control" type="date" name="dob" required><input class="form-control" name="gender" placeholder="Gender" required><input class="form-control" name="phone" placeholder="10-digit phone" required><input class="form-control" type="email" name="email" placeholder="Email" required><input class="form-control" name="parent_name" placeholder="Parent name" required><select class="form-select" name="department_id" required>{% for d in departments %}<option value="{{ d.id }}">{{ d.code }} - {{ d.name }}</option>{% endfor %}</select><select class="form-select" name="quota"><option>convener</option><option>management</option><option>spot</option></select><input class="form-control" name="entrance_rank" type="number" placeholder="Entrance rank"><input class="form-control" name="tenth_percent" type="number" step=".01" placeholder="10th %" required><input class="form-control" name="inter_percent" type="number" step=".01" placeholder="Intermediate %" required><label>Photo <input type="file" name="photo" required></label><label>Marks memo <input type="file" name="marks_memo" required></label><label>ID proof <input type="file" name="id_proof" required></label></div><button class="btn btn-navy mt-4">Submit application</button></form></div>{% endblock %}
