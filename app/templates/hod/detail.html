{% extends 'base.html' %}{% block content %}<div class="container p-4"><h2>{{ registration.full_name }}</h2><p>{{ registration.reference_no }} · {{ registration.email }} · {{ registration.phone }}</p><div class="d-flex gap-2"><form method="post" action="/hod/registrations/{{ registration.id }}/approve"><button class="btn btn-success">Approve</button></form><form method="post" action="/hod/registrations/{{ registration.id }}/reject"><input name="remarks" placeholder="Reason" required><button class="btn btn-danger">Reject</button></form><form method="post" action="/hod/registrations/{{ registration.id }}/correction"><input name="remarks" placeholder="Correction needed" required><button class="btn btn-warning">Send back</button></form></div></div>{% endblock %}
